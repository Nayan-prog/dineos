<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bill · App</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0b0b0c}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; display: flex; flex-direction: column; background: #0b0b0c; color: #f2f2f3; font-family: Inter, system-ui, sans-serif; font-size: 14px; line-height: 1.45">
<header style="flex: none; height: 56px; box-sizing: border-box; padding: 0 8px 0 4px; display: flex; align-items: center; gap: 4px">
  <a href="App-OrderDetail.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg></a>
  <div style="flex: 1; min-width: 0">
    <div style="font-size: 16px; font-weight: 700">Bill · Table 4</div>
    <div style="color: #a1a1a8; font-size: 12px">Bill #1048 · 6 guests</div>
  </div>
  
</header>
<div style="flex: 1; min-height: 0; overflow: hidden; padding: 4px 16px 0; display: flex; flex-direction: column; gap: 18px">
  <div style="background: #111113; border-radius: 18px; padding: 6px 16px">
    <sc-for list="{{lines}}" as="l" hint-placeholder-count="6">
      <div style="display: flex; gap: 10px; min-height: 40px; align-items: center; border-bottom: 1px solid {{l.rule}}"><span style="color: #a1a1a8; width: 26px">{{l.qty}}×</span><span style="flex: 1">{{l.name}}</span><span>₹{{l.total}}</span></div>
    </sc-for>
  </div>
  <div style="display: flex; flex-direction: column; gap: 6px; font-size: 13.5px; color: #a1a1a8; padding: 0 4px">
    <div style="display: flex; justify-content: space-between"><span>Subtotal</span><span>₹2,200</span></div>
    <div style="display: flex; justify-content: space-between"><span>GST 5% (CGST + SGST)</span><span>₹110</span></div>
    <div style="display: flex; justify-content: space-between; color: #f2f2f3; font-size: 20px; font-weight: 700; margin-top: 4px"><span>Total</span><span>₹2,310</span></div>
  </div>
  <section>
    <h2 style="margin: 0 0 10px; font-family: Comfortaa, sans-serif; font-size: 15px; font-weight: 700; color: #a1a1a8">Split</h2>
    <div style="display: flex; gap: 8px">
      <sc-for list="{{splits}}" as="s" hint-placeholder-count="4">
        <button type="button" onClick="{{s.pick}}" aria-pressed="{{s.on}}" style="flex: 1; height: 42px; border: 0; border-radius: 12px; background: {{s.bg}}; color: {{s.fg}}; font: inherit; font-weight: 600; cursor: pointer">{{s.label}}</button>
      </sc-for>
    </div>
    <div style="color: #8b8b93; font-size: 12.5px; margin-top: 8px">{{splitNote}}</div>
  </section>
  <section>
    <h2 style="margin: 0 0 10px; font-family: Comfortaa, sans-serif; font-size: 15px; font-weight: 700; color: #a1a1a8">Payment</h2>
    <div style="display: flex; gap: 8px">
      <sc-for list="{{methods}}" as="m" hint-placeholder-count="3">
        <button type="button" onClick="{{m.pick}}" aria-pressed="{{m.on}}" style="flex: 1; height: 42px; border: 0; border-radius: 12px; background: {{m.bg}}; color: {{m.fg}}; font: inherit; font-weight: 600; cursor: pointer">{{m.label}}</button>
      </sc-for>
    </div>
  </section>
</div>
<div style="flex: none; padding: 12px 16px 16px; border-top: 1px solid #1c1c20">
  <a href="App-Tables.dc.html" style="height: 52px; border-radius: 26px; background: #3b82f6; color: #ffffff; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 15px">Collect {{collect}} by {{method}}</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { split: 1, method: 'UPI' }; }
  renderVals() {
    var self = this;
    var raw = [[2, 'Paneer Tikka', '560'], [4, 'Butter Naan', '240'], [1, 'Butter Chicken', '380'], [1, 'Dal Makhani', '240'], [1, 'Veg Biryani', '260'], [2, 'Masala Lemonade', '180'], [2, 'Rasmalai', '280'], [1, 'Mineral Water', '60']];
    var lines = raw.map(function (l, i) { return { qty: l[0], name: l[1], total: l[2], rule: i === raw.length - 1 ? 'transparent' : '#1c1c20' }; });
    var sp = this.state.split;
    var splits = [1, 2, 3, 6].map(function (n) { var on = n === sp; return { label: n === 1 ? 'One bill' : n + ' ways', on: on, bg: on ? '#f2f2f3' : '#17171a', fg: on ? '#0b0b0c' : '#a1a1a8', pick: function () { self.setState({ split: n }); } }; });
    var each = Math.ceil(2310 / sp).toLocaleString('en-IN');
    var methods = ['Cash', 'UPI', 'Card'].map(function (m) { var on = m === self.state.method; return { label: m, on: on, bg: on ? '#f2f2f3' : '#17171a', fg: on ? '#0b0b0c' : '#a1a1a8', pick: function () { self.setState({ method: m }); } }; });
    return { lines: lines.slice(0, 6), splits: splits, methods: methods, method: this.state.method, splitNote: sp === 1 ? 'Whole table pays together' : sp + ' guests pay ₹' + each + ' each', collect: sp === 1 ? '₹2,310' : '₹' + each + ' × ' + sp };
  }
}
</script>
</body>
</html>
