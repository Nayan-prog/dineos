<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add table · Mobile web</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0b0b0c}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; display: flex; flex-direction: column; background: #0b0b0c; color: #f2f2f3; font-family: Inter, system-ui, sans-serif; font-size: 14px; line-height: 1.45">
<header style="flex: none; height: 56px; box-sizing: border-box; padding: 0 8px 0 4px; display: flex; align-items: center; gap: 4px">
  <a href="MW-Tables.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg></a>
  <div style="flex: 1; min-width: 0">
    <div style="font-size: 16px; font-weight: 700">Add table</div>
    <div style="color: #a1a1a8; font-size: 12px">Spice Garden</div>
  </div>
  
</header>
<div style="flex: 1; min-height: 0; overflow: hidden; padding: 8px 20px 0; display: flex; flex-direction: column; gap: 22px; color: #f5f5f5">

  <div style="height: 176px; border-radius: 20px; background: #111113; position: relative; overflow: hidden" aria-hidden="true">
    <div style="position: absolute; left: 50%; top: 50%; width: {{tw}}px; height: {{th}}px; margin-left: {{tml}}px; margin-top: {{tmt}}px; border-radius: {{tr}}; background: #232327; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; color: #f5f5f5">{{no}}</div>
    <sc-for list="{{chairs}}" as="c" hint-placeholder-count="4">
      <span style="position: absolute; left: {{c.x}}px; top: {{c.y}}px; width: 22px; height: 22px; border-radius: 7px; background: #3b82f6; opacity: 0.85"></span>
    </sc-for>
    <span style="position: absolute; right: 14px; bottom: 12px; color: #8b8b93; font-size: 12px">Preview</span>
  </div>

  <label style="display: flex; align-items: center; gap: 12px; padding: 4px 0 12px; border-bottom: 1px solid #232327">
    <span style="flex: none; width: 110px; color: #b3b3b3; font-size: 14px; font-weight: 600">Table number</span>
    <input type="text" value="{{no}}" style="flex: 1; min-width: 0; padding: 0; border: 0; background: transparent; color: #f5f5f5; font: inherit; font-size: 20px; font-weight: 600; outline: none">
  </label>

  <div>
    <div style="color: #b3b3b3; font-size: 14px; font-weight: 600; margin-bottom: 10px">Area</div>
    <div style="display: flex; flex-wrap: wrap; gap: 8px">
      <sc-for list="{{areas}}" as="a" hint-placeholder-count="3"><button type="button" onClick="{{a.pick}}" aria-pressed="{{a.on}}" style="height: 40px; padding: 0 16px; border: 0; border-radius: 20px; background: {{a.bg}}; color: {{a.fg}}; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">{{a.label}}</button></sc-for>
      <button type="button" style="height: 40px; padding: 0 14px; border: 0; border-radius: 20px; background: transparent; box-shadow: inset 0 0 0 1px #2c2c31; color: #b3b3b3; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">+ New area</button>
    </div>
  </div>

  <div style="display: flex; align-items: center; justify-content: space-between">
    <div><div style="font-size: 16px; font-weight: 600">Seats</div><div style="color: #8b8b93; font-size: 13px">Guests that fit at this table</div></div>
    <span style="display: flex; align-items: center; height: 44px; border-radius: 22px; background: #17171a">
      <button type="button" onClick="{{dec}}" aria-label="Fewer seats" style="width: 44px; height: 44px; border: 0; background: transparent; color: #f5f5f5; font: inherit; font-size: 22px; cursor: pointer">−</button>
      <span style="min-width: 28px; text-align: center; font-size: 18px; font-weight: 700">{{seats}}</span>
      <button type="button" onClick="{{inc}}" aria-label="More seats" style="width: 44px; height: 44px; border: 0; background: transparent; color: #f5f5f5; font: inherit; font-size: 22px; cursor: pointer">+</button>
    </span>
  </div>

  <div>
    <div style="color: #b3b3b3; font-size: 14px; font-weight: 600; margin-bottom: 10px">Shape</div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{shapes}}" as="s" hint-placeholder-count="3"><button type="button" onClick="{{s.pick}}" aria-pressed="{{s.on}}" style="height: 40px; border: 0; border-radius: 12px; background: {{s.bg}}; color: {{s.fg}}; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">{{s.label}}</button></sc-for>
    </div>
  </div>
</div>
<div style="flex: none; padding: 12px 20px 24px">
  <a href="MW-TableAdded.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 999px; background: #f5f5f5; color: #0b0b0c; font-size: 16px; font-weight: 600">Save and create QR code</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { area: 'Main hall', seats: 4, shape: 'Square' }; }
  renderVals() {
    var self = this, st = this.state, n = st.seats;
    var nextNo = { 'Main hall': 21, 'Terrace': 9, 'Private room': 3 }[st.area];
    var W = 350, H = 176, cx = W / 2, cy = H / 2;
    var dims = { Square: [n > 4 ? 110 : 84, 84, '14px'], Round: [96, 96, '50%'], Long: [Math.max(120, Math.ceil(n / 2) * 34), 64, '14px'] }[st.shape];
    var tw = dims[0], th = dims[1], chairs = [];
    if (st.shape === 'Round') {
      var R = 64;
      for (var i = 0; i < n; i++) { var a = -Math.PI / 2 + i * 2 * Math.PI / n; chairs.push({ x: Math.round(cx + R * Math.cos(a) - 11), y: Math.round(cy + R * Math.sin(a) - 11) }); }
    } else if (st.shape === 'Long' || n > 4) {
      var top = Math.ceil(n / 2), bottom = n - top;
      var row = function (count, y) { for (var i = 0; i < count; i++) { var x = cx - tw / 2 + (i + 0.5) * tw / count; chairs.push({ x: Math.round(x - 11), y: y }); } };
      row(top, Math.round(cy - th / 2 - 28)); row(bottom, Math.round(cy + th / 2 + 6));
    } else {
      var spots = [[cx - 11, cy - th / 2 - 28], [cx + tw / 2 + 6, cy - 11], [cx - 11, cy + th / 2 + 6], [cx - tw / 2 - 28, cy - 11]];
      for (var j = 0; j < n; j++) chairs.push({ x: Math.round(spots[j][0]), y: Math.round(spots[j][1]) });
    }
    var chip = function (on) { return { bg: on ? '#f5f5f5' : '#17171a', fg: on ? '#0b0b0c' : '#b3b3b3' }; };
    var areas = ['Main hall', 'Terrace', 'Private room'].map(function (a) { var c = chip(a === st.area); return { label: a, on: a === st.area, bg: c.bg, fg: c.fg, pick: function () { self.setState({ area: a }); } }; });
    var shapes = ['Square', 'Round', 'Long'].map(function (s) { var c = chip(s === st.shape); return { label: s, on: s === st.shape, bg: c.bg, fg: c.fg, pick: function () { self.setState({ shape: s }); } }; });
    return { no: 'T' + nextNo, seats: n, areas: areas, shapes: shapes, chairs: chairs, tw: tw, th: th, tml: -tw / 2, tmt: -th / 2, tr: dims[2],
      inc: function () { self.setState({ seats: Math.min(12, n + 1) }); }, dec: function () { self.setState({ seats: Math.max(1, n - 1) }); } };
  }
}
</script>
</body>
</html>
