<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Manager sign in · App</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0b0b0c}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; display: flex; flex-direction: column; background: #0b0b0c; color: #f2f2f3; font-family: Inter, system-ui, sans-serif; font-size: 14px; line-height: 1.45">
<div style="flex: 1; min-height: 0; box-sizing: border-box; padding: 12px 20px 28px; display: flex; flex-direction: column; color: #f5f5f5"><div style="height: 48px; display: flex; align-items: center"><a href="App-Welcome.dc.html" aria-label="Go back" style="width: 48px; height: 48px; margin-left: -12px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg></a><span style="flex: 1"></span><a href="#" style="height: 48px; display: flex; align-items: center; font-size: 14px; font-weight: 600">Forgot password</a></div>
  <div style="flex: 1; min-height: 0">
    <h1 style="margin: 20px 0 8px; font-size: 34px; line-height: 40px; font-weight: 700; letter-spacing: -0.5px">Manager sign in</h1>
    <p style="margin: 0 0 16px; font-size: 15px; line-height: 21px; color: #b3b3b3">Use the email you registered Spice Garden with.</p>
    <label style="margin-top: 32px; display: block; padding: 12px 0; border-bottom: 1px solid #232327">
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Email</span>
      <input type="email" autocomplete="email" value="manager@spicegarden.in" style="width: 100%; padding: 0; border: 0; background: transparent; color: #f5f5f5; font: inherit; font-size: 20px; outline: none">
    </label>
    <label style="margin-top: 12px; display: flex; align-items: center; padding: 12px 0; border-bottom: 1px solid #232327">
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Password</span>
      <input type="{{pwType}}" autocomplete="current-password" value="spicegarden" style="flex: 1; min-width: 0; padding: 0; border: 0; background: transparent; color: #f5f5f5; font: inherit; font-size: 20px; letter-spacing: {{pwSpacing}}; outline: none">
      <button type="button" onClick="{{togglePw}}" style="height: 36px; padding: 0; border: 0; background: transparent; color: #b3b3b3; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">{{pwBtn}}</button>
    </label>
  </div>
  <div>
    <a href="App-Dashboard.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 999px; background: #f5f5f5; color: #0b0b0c; font-size: 16px; font-weight: 600">Sign in</a>
    <a href="App-Dashboard.dc.html" style="margin-top: 12px; display: flex; align-items: center; justify-content: center; gap: 10px; height: 56px; border-radius: 999px; background: #17171a; box-shadow: inset 0 0 0 1px #2c2c31; color: #f5f5f5; font-size: 16px; font-weight: 600"><span aria-hidden="true" style="width: 24px; height: 24px; border-radius: 12px; background: #f5f5f5; color: #0b0b0c; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700">G</span>Continue with Google</a>
    <div style="margin-top: 32px; text-align: center; color: #b3b3b3; font-size: 14px">Working a shift? <a href="App-Login.dc.html"><span style="color: #f5f5f5; font-weight: 700">Sign in as staff</span></a></div>
  </div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { show: false }; }
  renderVals() {
    var self = this, sh = this.state.show;
    return { pwType: sh ? 'text' : 'password', pwSpacing: sh ? '0px' : '3px', pwBtn: sh ? 'Hide' : 'Show', togglePw: function () { self.setState({ show: !sh }); } };
  }
}
</script>
</body>
</html>
