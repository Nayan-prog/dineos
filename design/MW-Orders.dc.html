<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Orders · Mobile web</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0b0b0c}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="min-height: 100vh; display: flex; flex-direction: column; background: #0b0b0c; color: #f2f2f3; font-family: Inter, system-ui, sans-serif; font-size: 14px; line-height: 1.45">
<header style="position: relative; flex: none; height: 56px; box-sizing: border-box; padding: 0 8px 0 4px; display: flex; align-items: center"><a href="MW-Menu.dc.html" aria-label="Open menu" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"></path></svg></a><span style="flex: 1"></span><a href="MW-Dashboard.dc.html" style="position: absolute; left: 50%; transform: translateX(-50%); font-family: Comfortaa, sans-serif; font-weight: 700; font-size: 20px">DineOS</a><a href="MW-Notifications.dc.html" aria-label="Notifications" style="position: relative; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9a6 6 0 1 1 12 0c0 5 2 6 2 6H4s2-1 2-6"></path><path d="M10 19a2 2 0 0 0 4 0"></path></svg><span style="position: absolute; top: 11px; right: 12px; width: 8px; height: 8px; border-radius: 4px; background: #3b82f6"></span></a></header>
<div style="display: flex; flex-wrap: wrap">

<main style="flex: 1 1 auto; min-width: 0; box-sizing: border-box; padding: 8px 16px 24px; max-width: 1180px; display: flex; flex-direction: column; gap: 28px">
<div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px">
  <div>
    <h1 style="margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.3px">Orders</h1>
    <div style="color: #a1a1a8; font-size: 13.5px; margin-top: 2px">Saturday, 21 Nov · 126 orders today · 25 open</div>
  </div>
  <a href="MW-Tables.dc.html" style="display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 16px; border-radius: 20px; background: #3b82f6; color: #ffffff; font-size: 14px; font-weight: 600"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>New order</a>
</div>
<div style="display: flex; gap: 18px; flex-wrap: wrap; border-bottom: 1px solid #1c1c20">
  <sc-for list="{{tabs}}" as="t" hint-placeholder-count="6">
    <button type="button" onClick="{{t.pick}}" aria-pressed="{{t.on}}" style="height: 44px; padding: 0; border: 0; background: transparent; font: inherit; font-size: 14.5px; font-weight: {{t.weight}}; color: {{t.fg}}; box-shadow: inset 0 -2px 0 {{t.line}}; cursor: pointer">{{t.label}} <span style="color: #8b8b93; font-weight: 500">{{t.count}}</span></button>
  </sc-for>
</div>
<div style="background: #111113; border-radius: 18px; padding: 4px 18px; overflow-x: auto">
  <div style="min-width: 860px">
    <div style="display: grid; grid-template-columns: 90px 70px minmax(0, 1fr) 110px 80px 100px 120px 110px; gap: 12px; padding: 12px 0; color: #8b8b93; font-size: 12.5px; font-weight: 600; border-bottom: 1px solid #1c1c20">
      <span>Order</span><span>Table</span><span>Items</span><span>Waiter</span><span>Time</span><span>Amount</span><span>Progress</span><span>Status</span>
    </div>
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="10">
      <div style="display: grid; grid-template-columns: 90px 70px minmax(0, 1fr) 110px 80px 100px 120px 110px; gap: 12px; align-items: center; min-height: 54px; border-bottom: 1px solid {{r.rule}}">
        <span style="font-weight: 600">#{{r.id}}</span>
        <span style="font-weight: 700">T{{r.table}}</span>
        <span style="color: #a1a1a8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.items}}</span>
        <span>{{r.waiter}}</span>
        <span style="color: #a1a1a8">{{r.time}}</span>
        <span style="font-weight: 600">₹{{r.amount}}</span>
        <span style="display: flex; align-items: center; gap: 8px"><span style="flex: 1; height: 4px; border-radius: 2px; background: #232327"><span style="display: block; height: 4px; border-radius: 2px; background: #3b82f6; width: {{r.pct}}%"></span></span><span style="color: #8b8b93; font-size: 12px">{{r.done}}/{{r.total}}</span></span>
        <span><span style="background: transparent; border-radius: 0; padding: 0; font-size: 12px; font-weight: 600; color: {{r.color}}">{{r.status}}</span></span>
      </div>
    </sc-for>
  </div>
</div>
</main>
</div>
<nav aria-label="Main" style="flex: none; box-sizing: border-box; padding: 8px 16px 14px; background: #0b0b0c"><div style="height: 58px; box-sizing: border-box; border-radius: 29px; background: #17171a; padding: 5px; display: flex; gap: 4px"><a href="MW-Dashboard.dc.html" aria-label="Dashboard" style="flex: 1; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; color: #a1a1a8; background: transparent"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"></path></svg></a><a href="MW-Orders.dc.html" aria-label="Orders" aria-current="page" style="flex: 1; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; color: #f2f2f3; background: #2c2c31"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"></path><path d="M9 8h6M9 12h6"></path></svg></a><a href="MW-Tables.dc.html" aria-label="Tables" style="flex: 1; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; color: #a1a1a8; background: transparent"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9h18M5 9v11M19 9v11M8 9V6h8v3"></path></svg></a><a href="MW-Menu.dc.html" aria-label="More" style="flex: 1; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; color: #a1a1a8; background: transparent"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"></path></svg></a><a href="MW-Profile.dc.html" aria-label="Profile" style="flex: 1; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center"><span style="width: 26px; height: 26px; border-radius: 13px; background: #232327; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center">N</span></a></div></nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1600}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { tab: 'all' }; }
  renderVals() {
    var self = this;
    var look = { Placed: '#a1a1a8', Preparing: '#f5b454', Ready: '#7db0f9', Served: '#5eb88a', Billed: '#9cc3fa' };
    var raw = [
      [1052, 8, 'Paneer Tikka, Tandoori Chicken, Butter Naan ×2', 'Priya', 'Just now', '1,020', 0, 4, 'Placed'],
      [1051, 14, 'Hara Bhara Kabab, Manchow Soup', 'Rohit', '4 min', '380', 0, 2, 'Placed'],
      [1050, 3, 'Veg Biryani, Raita, Sweet Lassi', 'Priya', '6 min', '510', 1, 3, 'Preparing'],
      [1049, 7, 'Butter Chicken ×2, Garlic Naan ×4', 'Amit', '22 min', '1,040', 2, 6, 'Preparing'],
      [1048, 4, 'Paneer Tikka ×2, Dal Makhani, Butter Naan ×4', 'Priya', '28 min', '2,200', 3, 6, 'Ready'],
      [1047, 9, 'Tandoori Chicken, Butter Naan ×4', 'Rohit', '12 min', '600', 2, 2, 'Ready'],
      [1046, 12, 'Hakka Noodles, Chilli Chicken', 'Amit', '19 min', '540', 2, 2, 'Served'],
      [1045, 15, 'Masala Dosa ×2, Filter Coffee ×2', 'Rohit', '50 min', '640', 4, 4, 'Served'],
      [1044, 5, 'Butter Chicken, Veg Biryani, Rasmalai ×2', 'Priya', '61 min', '2,310', 5, 5, 'Billed'],
      [1043, 2, 'Dal Makhani, Tandoori Roti ×4, Lassi', 'Amit', '1 h 10 m', '1,840', 6, 6, 'Billed']
    ];
    var tab = this.state.tab;
    var list = raw.filter(function (r) { return tab === 'all' || r[8] === tab; });
    var rows = list.map(function (r, i) {
      return { id: r[0], table: r[1], items: r[2], waiter: r[3], time: r[4], amount: r[5], done: r[6], total: r[7], pct: Math.round(r[6] / r[7] * 100), status: r[8], color: look[r[8]], rule: i === list.length - 1 ? 'transparent' : '#1c1c20' };
    });
    var defs = [['all', 'All', 126], ['Placed', 'Placed', 6], ['Preparing', 'Preparing', 14], ['Ready', 'Ready', 5], ['Served', 'Served', 19], ['Billed', 'Billed', 82]];
    var tabs = defs.map(function (d) { var on = d[0] === tab; return { label: d[1], count: d[2], on: on, weight: on ? 700 : 500, fg: on ? '#f2f2f3' : '#a1a1a8', line: on ? '#7db0f9' : 'transparent', pick: function () { self.setState({ tab: d[0] }); } }; });
    return { rows: rows, tabs: tabs };
  }
}
</script>
</body>
</html>
