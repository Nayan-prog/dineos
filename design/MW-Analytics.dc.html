<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Analytics · Mobile web</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0b0b0c}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="min-height: 100vh; display: flex; flex-direction: column; background: #0b0b0c; color: #f2f2f3; font-family: Inter, system-ui, sans-serif; font-size: 14px; line-height: 1.45">
<header style="position: relative; flex: none; height: 56px; box-sizing: border-box; padding: 0 8px 0 4px; display: flex; align-items: center"><a href="MW-Menu.dc.html" aria-label="Open menu" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"></path></svg></a><span style="flex: 1"></span><a href="MW-Dashboard.dc.html" style="position: absolute; left: 50%; transform: translateX(-50%); font-family: Comfortaa, sans-serif; font-weight: 700; font-size: 20px">DineOS</a><a href="MW-Notifications.dc.html" aria-label="Notifications" style="position: relative; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9a6 6 0 1 1 12 0c0 5 2 6 2 6H4s2-1 2-6"></path><path d="M10 19a2 2 0 0 0 4 0"></path></svg><span style="position: absolute; top: 11px; right: 12px; width: 8px; height: 8px; border-radius: 4px; background: #3b82f6"></span></a></header>
<div style="display: flex; flex-wrap: wrap">

<main style="flex: 1 1 auto; min-width: 0; box-sizing: border-box; padding: 8px 16px 24px; max-width: 1180px; display: flex; flex-direction: column; gap: 28px">
<div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px">
  <div>
    <h1 style="margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.3px">Analytics</h1>
    <div style="color: #a1a1a8; font-size: 13.5px; margin-top: 2px">How the restaurant is doing over time</div>
  </div>
  <div style="display: flex; gap: 16px">
    <span style="font-size: 14.5px; font-weight: 500; color: #a1a1a8">Today</span>
    <span style="font-size: 14.5px; font-weight: 700; color: #7db0f9">7 days</span>
    <span style="font-size: 14.5px; font-weight: 500; color: #a1a1a8">28 days</span>
  </div>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px">
  <sc-for list="{{kpis}}" as="k" hint-placeholder-count="4">
    <div style="background: #111113; border-radius: 18px; padding: 16px"><div style="color: #a1a1a8; font-size: 13px">{{k.label}}</div><div style="display: flex; align-items: center; gap: 8px; margin-top: 6px"><span style="font-size: 26px; font-weight: 700">{{k.value}}</span><span style="background: transparent; border-radius: 0; padding: 0; font-size: 12px; font-weight: 600; color: {{k.c}}">{{k.delta}}</span></div><div style="color: #8b8b93; font-size: 12.5px; margin-top: 3px">{{k.note}}</div></div>
  </sc-for>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 12px">
  <section>
    <h2 style="margin: 0 0 12px; font-family: Comfortaa, sans-serif; font-size: 15px; font-weight: 700; color: #a1a1a8">Revenue by day</h2>
    <div style="background: #111113; border-radius: 18px; padding: 18px">
      <div style="display: flex; align-items: flex-end; gap: 10px; height: 180px">
        <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
          <div style="flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 6px">
            <span style="font-size: 11.5px; color: #a1a1a8">{{d.v}}</span>
            <div style="width: 100%; border-radius: 4px; background: #3b82f6; opacity: {{d.op}}; height: {{d.pct}}%"></div>
          </div>
        </sc-for>
      </div>
      <div style="display: flex; gap: 10px; margin-top: 8px"><sc-for list="{{days}}" as="d" hint-placeholder-count="7"><span style="flex: 1; text-align: center; color: #8b8b93; font-size: 12px">{{d.l}}</span></sc-for></div>
    </div>
  </section>
  <section>
    <h2 style="margin: 0 0 12px; font-family: Comfortaa, sans-serif; font-size: 15px; font-weight: 700; color: #a1a1a8">Top dishes</h2>
    <div style="background: #111113; border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 12px">
      <sc-for list="{{top}}" as="t" hint-placeholder-count="6">
        <div style="display: flex; align-items: center; gap: 12px">
          <span style="width: 18px; color: #8b8b93; font-weight: 600">{{t.rank}}</span>
          <span style="width: 130px; font-weight: 600">{{t.name}}</span>
          <div style="flex: 1; height: 8px; border-radius: 4px; background: #232327"><div style="height: 8px; border-radius: 4px; background: #3b82f6; width: {{t.pct}}%"></div></div>
          <span style="width: 70px; text-align: right; font-weight: 600">{{t.qty}}</span>
        </div>
      </sc-for>
    </div>
  </section>
  <section>
    <h2 style="margin: 0 0 12px; font-family: Comfortaa, sans-serif; font-size: 15px; font-weight: 700; color: #a1a1a8">Sales by category</h2>
    <div style="background: #111113; border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; height: 12px; border-radius: 6px; overflow: hidden; gap: 2px"><sc-for list="{{cats}}" as="c" hint-placeholder-count="5"><div style="background: {{c.color}}; width: {{c.pct}}%"></div></sc-for></div>
      <sc-for list="{{cats}}" as="c" hint-placeholder-count="5">
        <div style="display: flex; align-items: center; gap: 10px"><span style="width: 10px; height: 10px; border-radius: 3px; background: {{c.color}}"></span><span style="flex: 1; color: #a1a1a8">{{c.name}}</span><span style="font-weight: 600">₹{{c.value}}</span><span style="width: 44px; text-align: right; color: #8b8b93">{{c.pct}}%</span></div>
      </sc-for>
    </div>
  </section>
  <section>
    <h2 style="margin: 0 0 12px; font-family: Comfortaa, sans-serif; font-size: 15px; font-weight: 700; color: #a1a1a8">Busiest hours</h2>
    <div style="background: #111113; border-radius: 18px; padding: 18px">
      <div style="display: grid; grid-template-columns: 40px repeat(11, minmax(0, 1fr)); gap: 4px">
        <sc-for list="{{heat}}" as="row" hint-placeholder-count="7">
          <span style="color: #8b8b93; font-size: 12px; display: flex; align-items: center">{{row.day}}</span>
          <sc-for list="{{row.cells}}" as="cell" hint-placeholder-count="11"><span style="height: 22px; border-radius: 4px; background: #3b82f6; opacity: {{cell}}"></span></sc-for>
        </sc-for>
      </div>
      <div style="display: flex; justify-content: space-between; color: #8b8b93; font-size: 11.5px; margin: 8px 0 0 44px"><span>12 PM</span><span>5 PM</span><span>10 PM</span></div>
    </div>
  </section>
</div>
</main>
</div>
<nav aria-label="Main" style="flex: none; box-sizing: border-box; padding: 8px 16px 14px; background: #0b0b0c"><div style="height: 58px; box-sizing: border-box; border-radius: 29px; background: #17171a; padding: 5px; display: flex; gap: 4px"><a href="MW-Dashboard.dc.html" aria-label="Dashboard" style="flex: 1; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; color: #a1a1a8; background: transparent"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"></path></svg></a><a href="MW-Orders.dc.html" aria-label="Orders" style="flex: 1; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; color: #a1a1a8; background: transparent"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"></path><path d="M9 8h6M9 12h6"></path></svg></a><a href="MW-Tables.dc.html" aria-label="Tables" style="flex: 1; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; color: #a1a1a8; background: transparent"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9h18M5 9v11M19 9v11M8 9V6h8v3"></path></svg></a><a href="MW-Menu.dc.html" aria-label="More" style="flex: 1; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; color: #a1a1a8; background: transparent"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"></path></svg></a><a href="MW-Profile.dc.html" aria-label="Profile" style="flex: 1; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center"><span style="width: 26px; height: 26px; border-radius: 13px; background: #232327; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center">N</span></a></div></nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1600}}'>
class Component extends DCLogic {
  renderVals() {
    var dv = [31.2, 28.4, 33.9, 36.1, 41.8, 52.6, 48.3];
    var dl = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    var days = dv.map(function (v, i) { return { v: '₹' + v + 'k', l: dl[i], pct: Math.round(v / 52.6 * 85), op: i === 6 ? 1 : 0.6 }; });
    var tq = [['Butter Naan', 612], ['Paneer Tikka', 284], ['Butter Chicken', 251], ['Veg Biryani', 198], ['Dal Makhani', 187], ['Hakka Noodles', 142]];
    var top = tq.map(function (t, i) { return { rank: i + 1, name: t[0], qty: t[1] + ' sold', pct: Math.round(t[1] / 612 * 100) }; });
    var cv = [['Mains', 118400, '#3b82f6'], ['Starters', 64200, '#7db0f9'], ['Breads', 29800, '#c9b29b'], ['Drinks', 33100, '#5eb88a'], ['Desserts', 26800, '#f5b454']];
    var sum = cv.reduce(function (s, c) { return s + c[1]; }, 0);
    var cats = cv.map(function (c) { return { name: c[0], value: c[1].toLocaleString('en-IN'), color: c[2], pct: Math.round(c[1] / sum * 100) }; });
    var base = [0.3, 0.6, 0.75, 0.45, 0.2, 0.15, 0.2, 0.4, 0.7, 0.95, 0.85];
    var heat = dl.map(function (d, i) { var boost = i >= 5 ? 0.1 : (i === 0 ? 0.05 : -0.05); return { day: d, cells: base.map(function (b, j) { return Math.max(0.08, Math.min(1, b + boost + ((i * 7 + j * 3) % 5 - 2) * 0.03)).toFixed(2); }) }; });
    var kpis = [
      { label: 'Revenue', value: '₹2.72L', delta: '+14%', c: '#5eb88a', note: 'vs previous 7 days' },
      { label: 'Orders', value: '812', delta: '+9%', c: '#5eb88a', note: '116 per day' },
      { label: 'Avg bill', value: '₹1,456', delta: '+4%', c: '#5eb88a', note: 'per table' },
      { label: 'Avg prep time', value: '12m 50s', delta: '+30s', c: '#f5b454', note: 'Target under 12 min' }
    ];
    return { days: days, top: top, cats: cats, heat: heat, kpis: kpis };
  }
}
</script>
</body>
</html>
