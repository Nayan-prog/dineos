<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home · Waiter · Mobile web</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0b0b0c}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; display: flex; flex-direction: column; background: #0b0b0c; color: #f2f2f3; font-family: Inter, system-ui, sans-serif; font-size: 14px; line-height: 1.45">
<header style="flex: none; height: 64px; box-sizing: border-box; padding: 0 16px; display: flex; align-items: center; gap: 12px">
  <a href="MW-Profile.dc.html" aria-label="Profile" style="flex: none; width: 40px; height: 40px; border-radius: 20px; background: #232327; display: flex; align-items: center; justify-content: center; font-weight: 700">P</a>
  <div style="flex: 1; min-width: 0"><div style="font-size: 16px; font-weight: 700">Priya Sharma</div><div style="color: #a1a1a8; font-size: 12.5px">Tables T1 to T7 · Main hall</div></div>
  <button type="button" onClick="{{toggleBreak}}" style="height: 34px; padding: 0 12px; border: 0; border-radius: 17px; background: {{dutyBg}}; color: {{dutyFg}}; font: inherit; font-size: 12.5px; font-weight: 600; display: flex; align-items: center; gap: 6px; cursor: pointer"><span style="width: 7px; height: 7px; border-radius: 4px; background: {{dutyDot}}"></span>{{dutyLabel}}</button>
</header>
<div style="flex: 1; min-height: 0; overflow: hidden; padding: 0 16px; display: flex; flex-direction: column; gap: 14px">
  <a href="MW-Waiter-Alerts.dc.html" style="display: flex; align-items: center; gap: 10px; min-height: 44px; border-bottom: 1px solid #1c1c20"><span style="flex: 1; color: #a1a1a8; font-size: 13px">4 alerts need someone</span><span style="display: flex; align-items: center; gap: 4px; color: #7db0f9; font-size: 13px; font-weight: 600">Open alerts<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></span></a>
  <div role="tablist" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-bottom: 1px solid #1c1c20">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
      <button type="button" role="tab" aria-selected="{{t.on}}" onClick="{{t.pick}}" style="height: 64px; padding: 0; border: 0; background: transparent; color: #f2f2f3; font: inherit; text-align: left; box-shadow: inset 0 -2px 0 {{t.line}}; cursor: pointer">
        <span style="display: block; font-size: 22px; font-weight: 700; color: {{t.numFg}}">{{t.n}}</span>
        <span style="display: flex; align-items: center; gap: 5px; font-size: 12.5px; color: {{t.labelFg}}; font-weight: {{t.weight}}"><span style="width: 6px; height: 6px; border-radius: 3px; background: {{t.dot}}"></span>{{t.label}}</span>
      </button>
    </sc-for>
  </div>
  <div style="color: #8b8b93; font-size: 12.5px">{{note}}</div>
  <sc-if value="{{isEmpty}}" hint-placeholder-val="{{false}}"><div style="color: #8b8b93; padding: 24px 0; text-align: center">All caught up.</div></sc-if>
  <sc-if value="{{showDone}}" hint-placeholder-val="{{false}}">
    <div style="display: flex; flex-direction: column">
      <sc-for list="{{doneList}}" as="d" hint-placeholder-count="5">
        <div style="display: flex; align-items: center; gap: 12px; min-height: 52px; border-bottom: 1px solid #1c1c20"><span style="width: 52px; color: #8b8b93; font-size: 12.5px">{{d.time}}</span><span style="flex: 1"><span style="display: block; font-weight: 600">{{d.text}}</span><span style="display: block; color: #8b8b93; font-size: 12px">{{d.table}}</span></span></div>
      </sc-for>
    </div>
  </sc-if>
  <div style="display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{tasks}}" as="k" hint-placeholder-count="3">
      <article style="background: #111113; border-radius: 16px; padding: 14px; box-shadow: inset 0 0 0 1px {{k.ring}}">
        <div style="display: flex; align-items: center; gap: 10px">
          <span style="font-size: 20px; font-weight: 700">{{k.table}}</span>
          <span style="color: {{k.kindFg}}; font-size: 12.5px; font-weight: 600">{{k.kind}}</span>
          <span style="margin-left: auto; display: flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 700; color: {{k.timeFg}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l2 2M10 3h4"></path></svg>{{k.time}}</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px; margin: 10px 0 12px">
          <sc-for list="{{k.lines}}" as="l" hint-placeholder-count="2">
            <div style="display: flex; gap: 10px"><span style="flex: 1; min-width: 0; font-size: 15px; font-weight: 600">{{l.text}}</span><span style="flex: none; color: #8b8b93; font-size: 12px">{{l.side}}</span></div>
          </sc-for>
        </div>
        <sc-if value="{{k.isLink}}" hint-placeholder-val="{{false}}"><a href="{{k.href}}" style="display: flex; align-items: center; justify-content: center; height: 46px; border-radius: 23px; background: {{k.btnBg}}; color: {{k.btnFg}}; font-size: 15px; font-weight: 600">{{k.btn}}</a></sc-if>
        <sc-if value="{{k.isBtn}}" hint-placeholder-val="{{true}}"><button type="button" onClick="{{k.act}}" style="width: 100%; height: 46px; border: 0; border-radius: 23px; background: {{k.btnBg}}; color: {{k.btnFg}}; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer">{{k.btn}}</button></sc-if>
      </article>
    </sc-for>
  </div>
</div>
<nav aria-label="Main" style="flex: none; box-sizing: border-box; padding: 8px 16px 14px; background: #0b0b0c"><div style="height: 58px; box-sizing: border-box; border-radius: 29px; background: #17171a; padding: 5px; display: flex; gap: 4px"><a href="MW-Waiter-Home.dc.html" aria-label="Home" aria-current="page" style="flex: 1; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; color: #f2f2f3; background: #2c2c31"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.5L12 4l9 7.5M5.5 10v9.5a1 1 0 0 0 1 1H10v-6h4v6h3.5a1 1 0 0 0 1-1V10"></path></svg></a><a href="MW-Waiter-Tables.dc.html" aria-label="My tables" style="flex: 1; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; color: #a1a1a8; background: transparent"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9h18M5 9v11M19 9v11M8 9V6h8v3"></path></svg></a><a href="MW-TakeOrder.dc.html" aria-label="Take order" style="flex: 1.3; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; gap: 4px; background: #3b82f6; color: #ffffff; font-size: 13px; font-weight: 700"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Order</a><a href="MW-Waiter-Orders.dc.html" aria-label="Orders" style="flex: 1; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; color: #a1a1a8; background: transparent"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"></path><path d="M9 8h6M9 12h6"></path></svg></a><a href="MW-Profile.dc.html" aria-label="Profile" style="flex: 1; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center"><span style="width: 26px; height: 26px; border-radius: 13px; background: #232327; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center">P</span></a></div></nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { tab: 'serve', done: {} }; }

    var duty = { dutyLabel: _onBreak ? 'On break' : 'On duty', dutyBg: 'transparent', dutyFg: _onBreak ? '#f5c27a' : '#7fcfa3', dutyDot: _onBreak ? '#f5b454' : '#5eb88a', toggleBreak: function () { _me.setState({ onBreak: !_onBreak }); } };

    var T = [
      ['a', 'serve', 'T4', 'Food ready', '#7fcfa3', '2 min', false, [['1 × Butter Chicken', 'Guest 3 · Curry']], 'Mark served', '#3b82f6', '#ffffff', ''],
      ['b', 'serve', 'T9', 'Food ready', '#7fcfa3', '6 min', true, [['1 × Tandoori Chicken', 'Tandoor'], ['4 × Butter Naan', 'Tandoor']], 'Mark served', '#3b82f6', '#ffffff', ''],
      ['c', 'calls', 'T6', 'Guest called', '#9cc3fa', '1 min', false, [['Water', 'From the QR menu']], 'On my way', '#f2f2f3', '#0b0b0c', ''],
      ['d', 'calls', 'T2', 'Guest called', '#9cc3fa', '3 min', false, [['Help with order', 'From the QR menu']], 'On my way', '#f2f2f3', '#0b0b0c', ''],

    var open = T.filter(function (t) { return !st.done[t[0]]; });
    var count = function (k) { return open.filter(function (t) { return t[1] === k; }).length; };

    var tasks = st.tab === 'done' ? [] : open.filter(function (t) { return t[1] === st.tab; }).map(function (t) {
      return { table: t[2], kind: t[3], kindFg: t[4], time: t[5], timeFg: t[6] ? '#f5b454' : '#8b8b93', ring: t[6] ? 'rgba(245,180,84,0.45)' : 'transparent',

    });
    var defs = [['serve', 'To serve', '#5eb88a'], ['calls', 'Calls', '#7db0f9'], ['bills', 'Bills', '#c9b29b'], ['done', 'Done', '#3b82f6']];
    var tabs = defs.map(function (d) { var on = d[0] === st.tab; return { label: d[1], n: d[0] === 'done' ? doneN : count(d[0]), on: on, dot: d[2], line: on ? '#7db0f9' : 'transparent', numFg: on ? '#f2f2f3' : '#a1a1a8', labelFg: on ? '#f2f2f3' : '#8b8b93', weight: on ? 700 : 500, pick: function () { self.setState({ tab: d[0] }); } }; });
    var notes = { serve: 'Pick up from the kitchen pass', calls: 'Guests asking for you', bills: 'Tables ready to pay', done: 'Finished today' };
    var doneList = [['10:02', 'Served Tandoori Chicken', 'T1'], ['9:58', 'Brought water', 'T6'], ['9:51', 'Collected ₹1,840 by UPI', 'T2'], ['9:47', 'Took order · 6 items', 'T3'], ['9:40', 'Served Paneer Tikka × 2', 'T4']].map(function (d) { return { time: d[0], text: d[1], table: d[2] }; });
    return Object.assign({ tabs: tabs, tasks: tasks, note: notes[st.tab], isEmpty: st.tab !== 'done' && tasks.length === 0, showDone: st.tab === 'done', doneList: doneList }, duty);

</script>
</body>
</html>
