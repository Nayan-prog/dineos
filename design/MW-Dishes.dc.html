<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Menu and Dishes · Mobile web</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0b0b0c}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="min-height: 100vh; display: flex; flex-direction: column; background: #0b0b0c; color: #f2f2f3; font-family: Inter, system-ui, sans-serif; font-size: 14px; line-height: 1.45">
<header style="position: relative; flex: none; height: 56px; box-sizing: border-box; padding: 0 8px 0 4px; display: flex; align-items: center"><a href="MW-Menu.dc.html" aria-label="Open menu" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"></path></svg></a><span style="flex: 1"></span><a href="MW-Dashboard.dc.html" style="position: absolute; left: 50%; transform: translateX(-50%); font-family: Comfortaa, sans-serif; font-weight: 700; font-size: 20px">DineOS</a><a href="MW-Notifications.dc.html" aria-label="Notifications" style="position: relative; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9a6 6 0 1 1 12 0c0 5 2 6 2 6H4s2-1 2-6"></path><path d="M10 19a2 2 0 0 0 4 0"></path></svg><span style="position: absolute; top: 11px; right: 12px; width: 8px; height: 8px; border-radius: 4px; background: #3b82f6"></span></a></header>
<div style="display: flex; flex-wrap: wrap">

<main style="flex: 1 1 auto; min-width: 0; box-sizing: border-box; padding: 8px 16px 24px; max-width: 1180px; display: flex; flex-direction: column; gap: 28px">
<div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px">
  <div>
    <h1 style="margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.3px">Menu &amp; Dishes</h1>
    <div style="color: #a1a1a8; font-size: 13.5px; margin-top: 2px">48 dishes · 5 categories · 1 sold out</div>
  </div>
  <a href="#" style="display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 16px; border-radius: 20px; background: #3b82f6; color: #ffffff; font-size: 14px; font-weight: 600"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add dish</a>
</div>
<div style="display: flex; gap: 18px; flex-wrap: wrap; border-bottom: 1px solid #1c1c20">
  <sc-for list="{{cats}}" as="c" hint-placeholder-count="6">
    <button type="button" onClick="{{c.pick}}" aria-pressed="{{c.on}}" style="height: 44px; padding: 0; border: 0; background: transparent; font: inherit; font-size: 14.5px; font-weight: {{c.weight}}; color: {{c.fg}}; box-shadow: inset 0 -2px 0 {{c.line}}; cursor: pointer">{{c.label}}</button>
  </sc-for>
</div>
<div style="background: #111113; border-radius: 18px; padding: 4px 18px; overflow-x: auto">
  <div style="min-width: 820px">
    <div style="display: grid; grid-template-columns: minmax(0, 1fr) 110px 120px 90px 90px 100px 90px; gap: 12px; padding: 12px 0; color: #8b8b93; font-size: 12.5px; font-weight: 600; border-bottom: 1px solid #1c1c20">
      <span>Dish</span><span>Category</span><span>Station</span><span>Price</span><span>Prep</span><span>Sold today</span><span>Available</span>
    </div>
    <sc-for list="{{dishes}}" as="d" hint-placeholder-count="10">
      <div style="display: grid; grid-template-columns: minmax(0, 1fr) 110px 120px 90px 90px 100px 90px; gap: 12px; align-items: center; min-height: 56px; border-bottom: 1px solid {{d.rule}}; opacity: {{d.op}}">
        <span style="display: flex; align-items: center; gap: 10px; min-width: 0">
          <span style="flex: none; width: 36px; height: 36px; border-radius: 10px; background: #232327; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; color: #a1a1a8">{{d.initial}}</span>
          <span style="min-width: 0"><span style="display: flex; align-items: center; gap: 6px; font-weight: 600"><span style="flex: none; width: 10px; height: 10px; box-sizing: border-box; border: 1.5px solid {{d.veg}}; border-radius: 2px"></span>{{d.name}}</span><span style="display: block; color: #8b8b93; font-size: 12px">{{d.desc}}</span></span>
        </span>
        <span style="color: #a1a1a8">{{d.cat}}</span>
        <span style="color: #a1a1a8">{{d.station}}</span>
        <span style="font-weight: 600">₹{{d.price}}</span>
        <span style="color: #a1a1a8">{{d.prep}} min</span>
        <span style="font-weight: 600">{{d.sold}}</span>
        <button type="button" role="switch" aria-checked="{{d.on}}" aria-label="{{d.name}} available" onClick="{{d.toggle}}" style="width: 48px; height: 44px; padding: 0; border: 0; background: transparent; display: flex; align-items: center; cursor: pointer">
          <span style="width: 40px; height: 24px; box-sizing: border-box; border-radius: 12px; padding: 3px; background: {{d.track}}; display: flex; justify-content: {{d.justify}}"><span style="width: 18px; height: 18px; border-radius: 9px; background: #f2f2f3"></span></span>
        </button>
      </div>
    </sc-for>
  </div>
</div>
</main>
</div>
<nav aria-label="Main" style="flex: none; box-sizing: border-box; padding: 8px 16px 14px; background: #0b0b0c"><div style="height: 58px; box-sizing: border-box; border-radius: 29px; background: #17171a; padding: 5px; display: flex; gap: 4px"><a href="MW-Dashboard.dc.html" aria-label="Dashboard" style="flex: 1; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; color: #a1a1a8; background: transparent"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"></path></svg></a><a href="MW-Orders.dc.html" aria-label="Orders" style="flex: 1; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; color: #a1a1a8; background: transparent"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"></path><path d="M9 8h6M9 12h6"></path></svg></a><a href="MW-Tables.dc.html" aria-label="Tables" style="flex: 1; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; color: #a1a1a8; background: transparent"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9h18M5 9v11M19 9v11M8 9V6h8v3"></path></svg></a><a href="MW-Menu.dc.html" aria-label="More" style="flex: 1; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; color: #a1a1a8; background: transparent"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"></path></svg></a><a href="MW-Profile.dc.html" aria-label="Profile" style="flex: 1; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center"><span style="width: 26px; height: 26px; border-radius: 13px; background: #232327; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center">N</span></a></div></nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1600}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { cat: 'All', off: { gj: true } }; }
  renderVals() {
    var self = this;
    var veg = '#5eb88a', non = '#e0705c';
    var raw = [
      ['pt', 'Paneer Tikka', 'Cottage cheese, tandoor spices', 'Starters', 'Tandoor', 280, 12, 42, veg],
      ['tc', 'Tandoori Chicken', 'Half, yoghurt marinade', 'Starters', 'Tandoor', 360, 18, 26, non],
      ['hb', 'Hara Bhara Kabab', 'Spinach and pea patties', 'Starters', 'Tandoor', 220, 10, 14, veg],
      ['bc', 'Butter Chicken', 'Tomato butter gravy', 'Mains', 'Curry', 380, 15, 38, non],
      ['dm', 'Dal Makhani', 'Black lentils, slow cooked', 'Mains', 'Curry', 240, 10, 29, veg],
      ['vb', 'Veg Biryani', 'Dum basmati, raita', 'Mains', 'Curry', 260, 20, 31, veg],
      ['hn', 'Hakka Noodles', 'Wok tossed vegetables', 'Mains', 'Chinese', 220, 10, 24, veg],
      ['md', 'Masala Dosa', 'Potato filling, chutneys', 'Mains', 'South Indian', 180, 8, 21, veg],
      ['bn', 'Butter Naan', 'Tandoor bread', 'Breads', 'Tandoor', 60, 4, 96, veg],
      ['gj', 'Gulab Jamun', 'Two pieces, warm', 'Desserts', 'Dessert', 120, 2, 11, veg],
      ['sl', 'Sweet Lassi', 'Thick yoghurt drink', 'Drinks', 'Bar', 110, 3, 18, veg]
    ];
    var cat = this.state.cat, off = this.state.off;
    var list = raw.filter(function (d) { return cat === 'All' || d[3] === cat; });
    var dishes = list.map(function (d, i) {
      var on = !off[d[0]];
      return { name: d[1], desc: d[2], cat: d[3], station: d[4], price: d[5], prep: d[6], sold: d[7], veg: d[8], initial: d[1].charAt(0), on: on, op: on ? 1 : 0.55, track: on ? '#3b82f6' : '#3a3a40', justify: on ? 'flex-end' : 'flex-start', rule: i === list.length - 1 ? 'transparent' : '#1c1c20',
        toggle: function () { var n = Object.assign({}, self.state.off); n[d[0]] = on; self.setState({ off: n }); } };
    });
    var cats = ['All', 'Starters', 'Mains', 'Breads', 'Desserts', 'Drinks'].map(function (c) { var on = c === cat; return { label: c, on: on, weight: on ? 700 : 500, fg: on ? '#f2f2f3' : '#a1a1a8', line: on ? '#7db0f9' : 'transparent', pick: function () { self.setState({ cat: c }); } }; });
    return { dishes: dishes, cats: cats };
  }
}
</script>
</body>
</html>
