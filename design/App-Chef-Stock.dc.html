<helmet>

<style>

  <span style="flex: 1"></span>
  <span style="position: absolute; left: 50%; transform: translateX(-50%); font-family: Comfortaa, sans-serif; font-weight: 700; font-size: 20px">DineOS</span>

  </div>
  <div>
    <sc-for list="{{dishes}}" as="d" hint-placeholder-count="7">
      <div style="display: flex; align-items: center; gap: 12px; min-height: 60px; border-bottom: 1px solid #1c1c20">
        <span style="flex: 1; min-width: 0"><span style="display: block; font-weight: 600; color: {{d.nameFg}}">{{d.name}}</span><span style="display: block; font-size: 12.5px; color: {{d.subFg}}">{{d.sub}}</span></span>
        <button type="button" role="switch" aria-checked="{{d.on}}" aria-label="{{d.name}} available" onClick="{{d.toggle}}" style="width: 52px; height: 44px; padding: 0; border: 0; background: transparent; display: flex; align-items: center; justify-content: flex-end; cursor: pointer">
          <span style="width: 44px; height: 26px; box-sizing: border-box; border-radius: 13px; padding: 3px; background: {{d.track}}; display: flex; justify-content: {{d.justify}}"><span style="width: 20px; height: 20px; border-radius: 10px; background: #f2f2f3"></span></span>
        </button>
      </div>
    </sc-for>
  </div>
  <div style="color: #8b8b93; font-size: 12.5px">Turning a dish off hides it from waiters and the guest QR menu straight away.</div>
</div>
<nav aria-label="Main" style="flex: none; box-sizing: border-box; padding: 8px 16px 14px; background: #0b0b0c"><div style="height: 58px; box-sizing: border-box; border-radius: 29px; background: #17171a; padding: 5px; display: flex; gap: 4px">

<a href="App-Chef-Done.dc.html" aria-label="Done" style="flex: 1; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; color: #a1a1a8; background: transparent"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12l5 5L20 6"></path></svg></a>
<a href="App-Chef-Stock.dc.html" aria-label="Stock" aria-current="page" style="flex: 1; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; color: #f2f2f3; background: #2c2c31"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7l9-4 9 4-9 4zM3 7v10l9 4 9-4V7M12 11v10"></path></svg></a>
<a href="App-Notifications.dc.html" aria-label="Alerts" style="flex: 1; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; color: #a1a1a8; background: transparent"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9a6 6 0 1 1 12 0c0 5 2 6 2 6H4s2-1 2-6"></path><path d="M10 19a2 2 0 0 0 4 0"></path></svg></a>
<a href="App-Profile.dc.html" aria-label="Profile" style="flex: 1; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center"><span style="width: 26px; height: 26px; border-radius: 13px; background: #232327; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center">R</span></a>
</div></nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { off: { hb: true } }; }
  renderVals() {
    var self = this, off = this.state.off;
    var raw = [['pt', 'Paneer Tikka', '34 made today'], ['tc', 'Tandoori Chicken', '26 made today'], ['hb', 'Hara Bhara Kabab', 'Out since 9:20 PM'], ['bn', 'Butter Naan', '96 made today'], ['gn', 'Garlic Naan', '41 made today'], ['tr', 'Tandoori Roti', '58 made today'], ['mt', 'Malai Tikka', '12 made today']];
    return { dishes: raw.map(function (r) { var on = !off[r[0]]; return { name: r[1], sub: on ? r[2] : 'Sold out · hidden from menu', on: on, nameFg: on ? '#f2f2f3' : '#8b8b93', subFg: on ? '#8b8b93' : '#e0705c', track: on ? '#3b82f6' : '#3a3a40', justify: on ? 'flex-end' : 'flex-start', toggle: function () { var n = Object.assign({}, self.state.off); n[r[0]] = on; self.setState({ off: n }); } }; }) };
  }
}
</script>
