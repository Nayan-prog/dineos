<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Staff sign in · App</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0b0b0c}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; display: flex; flex-direction: column; background: #0b0b0c; color: #f2f2f3; font-family: Inter, system-ui, sans-serif; font-size: 14px; line-height: 1.45">
<div style="flex: 1; min-height: 0; box-sizing: border-box; padding: 12px 20px 28px; display: flex; flex-direction: column; color: #f5f5f5"><div style="height: 48px; display: flex; align-items: center"><a href="App-Welcome.dc.html" aria-label="Go back" style="width: 48px; height: 48px; margin-left: -12px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg></a><span style="flex: 1"></span><span style="font-size: 14px; font-weight: 600; color: #b3b3b3">Spice Garden</span></div>
  <div style="flex: 1; min-height: 0; display: flex; flex-direction: column">
    <h1 style="margin: 20px 0 8px; font-size: 34px; line-height: 40px; font-weight: 700; letter-spacing: -0.5px">Staff sign in</h1>
    <p style="margin: 0 0 16px; font-size: 15px; line-height: 21px; color: #b3b3b3">Enter your staff ID and 4-digit PIN.</p>
    <label style="margin-top: 20px; display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid #232327">
      <span style="color: #b3b3b3; font-size: 15px">Staff ID</span>
      <input type="text" value="S-105" style="flex: 1; min-width: 0; padding: 0; border: 0; background: transparent; color: #f5f5f5; font: inherit; font-size: 20px; outline: none">
    </label>
    <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 22px">
      <span style="color: #b3b3b3; font-size: 15px">PIN</span>
      <div style="display: flex; gap: 14px"><sc-for list="{{dots}}" as="d" hint-placeholder-count="4"><span style="width: 14px; height: 14px; border-radius: 7px; background: {{d.bg}}; box-shadow: inset 0 0 0 1.5px {{d.ring}}"></span></sc-for></div>
    </div>
    <sc-if value="{{ready}}" hint-placeholder-val="{{false}}">
      <div style="margin-top: 16px; display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 16px; background: #111113">
        <span style="width: 40px; height: 40px; border-radius: 20px; background: #232327; display: flex; align-items: center; justify-content: center; font-weight: 700">P</span>
        <span style="flex: 1"><span style="display: block; font-weight: 600">Priya Sharma</span><span style="display: block; color: #b3b3b3; font-size: 13px">Waiter · Tables 1 to 7</span></span>
      </div>
    </sc-if>
    <div style="margin-top: auto; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{keys}}" as="k" hint-placeholder-count="12">
        <button type="button" onClick="{{k.press}}" aria-label="{{k.aria}}" style="height: 56px; border: 0; border-radius: 16px; background: {{k.bg}}; color: #f5f5f5; font: inherit; font-size: 22px; font-weight: 600; cursor: pointer">{{k.label}}</button>
      </sc-for>
    </div>
  </div>
  <div style="margin-top: 16px">
    <sc-if value="{{ready}}" hint-placeholder-val="{{false}}"><a href="App-Waiter-Home.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 999px; background: #f5f5f5; color: #0b0b0c; font-size: 16px; font-weight: 600">Start shift</a></sc-if>
    <sc-if value="{{notReady}}" hint-placeholder-val="{{true}}"><span style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 999px; background: #f5f5f5; color: #0b0b0c; font-size: 16px; font-weight: 600; background: #232327; color: #8b8b93">Start shift</span></sc-if>
    <div style="margin-top: 20px; text-align: center; color: #b3b3b3; font-size: 14px">Manager? <a href="App-Login-Manager.dc.html"><span style="color: #f5f5f5; font-weight: 700">Sign in with email</span></a></div>
  </div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { pin: '47' }; }
  renderVals() {
    var self = this, pin = this.state.pin;
    var dots = [0, 1, 2, 3].map(function (i) { var f = i < pin.length; return { bg: f ? '#f5f5f5' : 'transparent', ring: f ? '#f5f5f5' : '#3a3a40' }; });
    var labels = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '', '0', '⌫'];
    var keys = labels.map(function (l) {
      return { label: l, aria: l === '⌫' ? 'Delete' : (l === '' ? 'Blank' : l), bg: l === '' ? 'transparent' : '#111113',
        press: function () { if (l === '') return; if (l === '⌫') { self.setState({ pin: pin.slice(0, -1) }); return; } if (pin.length < 4) self.setState({ pin: pin + l }); } };
    });
    return { dots: dots, keys: keys, ready: pin.length === 4, notReady: pin.length < 4 };
  }
}
</script>
</body>
</html>
