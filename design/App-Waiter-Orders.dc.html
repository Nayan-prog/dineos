<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Orders · Waiter</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0b0b0c}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; display: flex; flex-direction: column; background: #0b0b0c; color: #f2f2f3; font-family: Inter, system-ui, sans-serif; font-size: 14px; line-height: 1.45">
<header style="flex: none; height: 64px; box-sizing: border-box; padding: 0 16px; display: flex; align-items: center; gap: 12px">
  <a href="App-Profile.dc.html" aria-label="Profile" style="flex: none; width: 40px; height: 40px; border-radius: 20px; background: #232327; display: flex; align-items: center; justify-content: center; font-weight: 700">P</a>
  <div style="flex: 1; min-width: 0"><div style="font-size: 16px; font-weight: 700">Priya Sharma</div><div style="color: #a1a1a8; font-size: 12.5px">My open orders</div></div>
  <button type="button" onClick="{{toggleBreak}}" style="height: 34px; padding: 0 12px; border: 0; border-radius: 17px; background: {{dutyBg}}; color: {{dutyFg}}; font: inherit; font-size: 12.5px; font-weight: 600; display: flex; align-items: center; gap: 6px; cursor: pointer"><span style="width: 7px; height: 7px; border-radius: 4px; background: {{dutyDot}}"></span>{{dutyLabel}}</button>
</header>
<div style="flex: 1; min-height: 0; overflow: hidden; padding: 0 16px; display: flex; flex-direction: column; gap: 4px">
  <sc-for list="{{orders}}" as="o" hint-placeholder-count="5">
    <a href="App-OrderDetail.dc.html" style="display: flex; flex-direction: column; gap: 8px; padding: 14px 0; border-bottom: 1px solid #1c1c20">
      <span style="display: flex; align-items: center; gap: 10px"><span style="font-size: 18px; font-weight: 700">{{o.table}}</span><span style="color: #8b8b93; font-size: 12.5px">#{{o.id}} · {{o.guests}} guests</span><span style="margin-left: auto; font-size: 12.5px; font-weight: 600; color: {{o.fg}}">{{o.state}}</span></span>
      <span style="display: flex; align-items: center; gap: 10px"><span style="flex: 1; height: 4px; border-radius: 2px; background: #232327"><span style="display: block; height: 4px; border-radius: 2px; background: #3b82f6; width: {{o.pct}}%"></span></span><span style="color: #a1a1a8; font-size: 12px">{{o.served}}/{{o.total}} served</span></span>
      <span style="color: #8b8b93; font-size: 12.5px">{{o.latest}}</span>
    </a>
  </sc-for>
</div>
<nav aria-label="Main" style="flex: none; box-sizing: border-box; padding: 8px 16px 14px; background: #0b0b0c"><div style="height: 58px; box-sizing: border-box; border-radius: 29px; background: #17171a; padding: 5px; display: flex; gap: 4px"><a href="App-Waiter-Home.dc.html" aria-label="Home" style="flex: 1; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; color: #a1a1a8; background: transparent"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.5L12 4l9 7.5M5.5 10v9.5a1 1 0 0 0 1 1H10v-6h4v6h3.5a1 1 0 0 0 1-1V10"></path></svg></a><a href="App-Waiter-Tables.dc.html" aria-label="My tables" style="flex: 1; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; color: #a1a1a8; background: transparent"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9h18M5 9v11M19 9v11M8 9V6h8v3"></path></svg></a><a href="App-TakeOrder.dc.html" aria-label="Take order" style="flex: 1.3; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; gap: 4px; background: #3b82f6; color: #ffffff; font-size: 13px; font-weight: 700"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Order</a><a href="App-Waiter-Orders.dc.html" aria-label="Orders" aria-current="page" style="flex: 1; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; color: #f2f2f3; background: #2c2c31"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"></path><path d="M9 8h6M9 12h6"></path></svg></a><a href="App-Profile.dc.html" aria-label="Profile" style="flex: 1; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center"><span style="width: 26px; height: 26px; border-radius: 13px; background: #232327; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center">P</span></a></div></nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = {}; }
  renderVals() {

    var _onBreak = !!this.state.onBreak, _me = this;
    var duty = { dutyLabel: _onBreak ? 'On break' : 'On duty', dutyBg: 'transparent', dutyFg: _onBreak ? '#f5c27a' : '#7fcfa3', dutyDot: _onBreak ? '#f5b454' : '#5eb88a', toggleBreak: function () { _me.setState({ onBreak: !_onBreak }); } };

    var R = [['T4', 1048, 5, 3, 6, 'Food ready', '#7fcfa3', 'Butter Chicken ready · 2 min ago'], ['T7', 1049, 4, 0, 6, 'Late', '#f5c27a', 'Tandoori Chicken cooking · 22 min'], ['T3', 1050, 3, 1, 3, 'Cooking', '#f5c27a', 'Veg Biryani cooking · 6 min'], ['T1', 1044, 4, 4, 4, 'All served', '#9cc3fa', 'Waiting for dessert order'], ['T5', 1041, 4, 5, 5, 'Bill asked', '#d6c3ae', '₹2,310 · open the bill']];
    return Object.assign({ orders: R.map(function (r) { return { table: r[0], id: r[1], guests: r[2], served: r[3], total: r[4], pct: Math.round(r[3] / r[4] * 100), state: r[5], fg: r[6], latest: r[7] }; }) }, duty);
  }
}
</script>
</body>
</html>
